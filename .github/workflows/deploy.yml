name: Deploy

# Every push to main goes live at little-alexandria.pages.dev: D1 migrations
# first, then the Pages build. Skips cleanly (rather than failing) until the
# CLOUDFLARE_API_TOKEN secret exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No CLOUDFLARE_API_TOKEN secret yet; skipping deploy."; fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://little-alexandria.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply little-alexandria --remote
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name little-alexandria --branch main --commit-dirty=true
